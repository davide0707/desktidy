name: Feature request
description: An idea to make DeskTidy smarter or easier to use
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like DeskTidy to do?
      description: Describe the situation and the files involved.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: checkboxes
    id: principles
    attributes:
      label: DeskTidy's principles
      description: Not required, but ideas that keep them are easier to accept.
      options:
        - label: This could work without the AI (offline first)
        - label: Nothing new would leave the computer, or the idea says what and why
        - label: Every change it makes could be undone
