name: Bug report
description: Something went wrong, or a file ended up in the wrong place
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Before posting, please remove personal paths, names and anything else private from
        the outputs below. Security problems: please report them privately (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did DeskTidy do instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The file (its kind and name, not its content), the folder it was in, the command you ran.
  - type: input
    id: version
    attributes:
      label: DeskTidy version and system
      description: The first lines of `desktidy about` (version, system, Python)
      placeholder: "DeskTidy 1.4.1 · Windows 11 24H2 / macOS 15.5 / Ubuntu 24.04 (GNOME)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is DeskTidy installed?
      options:
        - Windows build (zip, no Python)
        - pipx / pip
        - From the source (git clone)
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI mode and service
      description: "`desktidy ai` shows them"
      options:
        - Rules only (off)
        - limited
        - moderate
        - ai-only
        - Always AI (all)
  - type: textarea
    id: explain
    attributes:
      label: Output of `desktidy explain <file>` (if a file was misplaced)
      render: text
  - type: textarea
    id: log
    attributes:
      label: Output of `desktidy log errors`
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal paths, names and private content from what I pasted
          required: true
