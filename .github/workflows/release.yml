name: Release

# Push a tag like v1.4.0 (equal to desktidy.__version__): the tests run on Windows, macOS and Linux, the package and
# the Windows build (no Python needed) are built, and a GitHub release is created with the CHANGELOG section, the
# wheel, the source archive and the Windows zip.
#
# PyPI (optional): once set up, the package is also published there with Trusted Publishing (no token stored
# anywhere). One-time setup: on pypi.org, Publishing -> add a "pending publisher" for project "desktidy", owner
# "davide0707", repository "desktidy", workflow "release.yml", environment "pypi"; then on GitHub, Settings ->
# Secrets and variables -> Actions -> Variables, add PYPI_PUBLISH = true.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ai,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -t .

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version
        run: |
          version=$(python -c "import desktidy; print(desktidy.__version__)")
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} but __version__ is $version"; exit 1; }
      - name: Build
        run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows:
    name: Windows build (no Python needed)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build desktidy.exe and desktidyw.exe, zip them, smoke test
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/DeskTidy-*-windows.zip
            dist/DeskTidy-*-windows.zip.sha256
            dist/winget/

  pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PYPI_PUBLISH == 'true'   # off until the one-time setup above is done
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: windows/
      - name: The Windows zip goes with the release (the winget manifests stay an artifact, submitted by hand)
        run: mv windows/DeskTidy-*-windows.zip windows/DeskTidy-*-windows.zip.sha256 dist/
      - name: Notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DeskTidy ${GITHUB_REF_NAME#v}" --notes-file notes.md
