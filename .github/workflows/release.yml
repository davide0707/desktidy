name: Release

# Push a tag like v1.2.0 (equal to desktidy.__version__): tests run, the package is built and published to PyPI
# with Trusted Publishing (no token stored anywhere), and a GitHub release is created with the CHANGELOG section.
# One-time setup on pypi.org: Publishing -> add a "pending publisher" for project "desktidy", owner "davide0707",
# repository "desktidy", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version
        shell: pwsh
        run: |
          $version = python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('desktidy/__init__.py').read()).group(1))"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but __version__ is $version" }
      - name: Install
        run: python -m pip install -e ".[ai,dev]" build
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DeskTidy ${GITHUB_REF_NAME#v}" --notes-file notes.md
