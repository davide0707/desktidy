name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ai,dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: The commands start
        run: |
          desktidy --version
          desktidy about
          python -m desktidy.service --dry-run --now --no-ai
        env:
          DESKTIDY_HOME: ${{ runner.temp }}/desktidy-home
