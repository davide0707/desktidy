[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "desktidy"
dynamic = ["version"]
description = "Keeps Downloads, Desktop and Documents tidy: understands what each file is about and files it in the right folder - offline first, Claude AI only when needed, for fractions of a cent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Di Filippo Davide" }]
keywords = ["file-organizer", "downloads", "desktop", "automation", "windows", "ocr", "claude", "productivity",
            "declutter", "file-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Italian",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = ["pypdf>=5.0", "pillow>=10.0"]

[project.optional-dependencies]
ai = ["anthropic>=1.11"]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/davide0707/desktidy"
Issues = "https://github.com/davide0707/desktidy/issues"
Changelog = "https://github.com/davide0707/desktidy/blob/main/CHANGELOG.md"

[project.scripts]
desktidy = "desktidy.cli:main"

[project.gui-scripts]
desktidy-service = "desktidy.service:main"

[tool.setuptools]
packages = ["desktidy"]

[tool.setuptools.package-data]
desktidy = ["default_rules.json", "ocr.ps1"]

[tool.setuptools.dynamic]
version = { attr = "desktidy.__version__" }

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "B904", "B905", "SIM105", "SIM108", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"docs/*" = ["E501"]
